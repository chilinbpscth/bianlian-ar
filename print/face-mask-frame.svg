<?xml version="1.0" encoding="UTF-8"?>
<!-- A4 portrait printable face-mask frame. Oval proportions match app paint OVAL (rx/ry ≈ 0.44/0.48). -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; font-size: 7.2px; font-weight: 700; fill: #2c2420; }
      .sub { font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; font-size: 4.2px; fill: #6b5e55; }
      .cut-label { font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; font-size: 3.6px; font-weight: 700; fill: #9b1c1c; }
      .hint { font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; font-size: 3.4px; fill: #6b5e55; }
    ]]></style>
  </defs>

  <!-- Page margin guide (light) -->
  <rect x="8" y="8" width="194" height="281" fill="none" stroke="#e8d9c8" stroke-width="0.35" stroke-dasharray="2 2"/>

  <!-- Title -->
  <text x="105" y="22" text-anchor="middle" class="title">變臉 · 臉譜紙樣｜眼口剪空後填色</text>
  <text x="105" y="29" text-anchor="middle" class="sub">橙色外框＝填色範圍 · 白色眼／口＝剪空 · 內虛線＝參考臉形</text>

  <!-- Face group centered; proportions: rx:ry = 0.44:0.48 -->
  <g transform="translate(105,158)">
    <!-- Soft paper fill outside oval for contrast when printing B/W-ish -->
    <ellipse cx="0" cy="0" rx="86" ry="94" fill="#fffaf3" stroke="none"/>

    <!-- Outer fill zone (light warm) -->
    <ellipse cx="0" cy="0" rx="80" ry="87.3" fill="#fff3e6" stroke="#f97316" stroke-width="1.8"/>

    <!-- Inner face hint (dashed) ~0.82 of outer -->
    <ellipse cx="0" cy="0" rx="65.6" ry="71.6" fill="none" stroke="#a89888" stroke-width="0.7" stroke-dasharray="3.5 2.8"/>

    <!-- LEFT EYE cutout hole -->
    <ellipse cx="-28" cy="-8" rx="13.5" ry="9" fill="#ffffff" stroke="#9b1c1c" stroke-width="1.1" stroke-dasharray="2 1.2"/>
    <line x1="-41.5" y1="-8" x2="-38" y2="-8" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="-14.5" y1="-8" x2="-18" y2="-8" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="-28" y1="-17" x2="-28" y2="-13.5" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="-28" y1="1" x2="-28" y2="-2.5" stroke="#9b1c1c" stroke-width="0.6"/>
    <text x="-28" y="-22" text-anchor="middle" class="cut-label">✂ 左眼 · 剪空</text>

    <!-- RIGHT EYE cutout hole -->
    <ellipse cx="28" cy="-8" rx="13.5" ry="9" fill="#ffffff" stroke="#9b1c1c" stroke-width="1.1" stroke-dasharray="2 1.2"/>
    <line x1="14.5" y1="-8" x2="18" y2="-8" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="41.5" y1="-8" x2="38" y2="-8" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="28" y1="-17" x2="28" y2="-13.5" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="28" y1="1" x2="28" y2="-2.5" stroke="#9b1c1c" stroke-width="0.6"/>
    <text x="28" y="-22" text-anchor="middle" class="cut-label">✂ 右眼 · 剪空</text>

    <!-- MOUTH cutout hole -->
    <ellipse cx="0" cy="38" rx="22" ry="10" fill="#ffffff" stroke="#9b1c1c" stroke-width="1.1" stroke-dasharray="2 1.2"/>
    <line x1="-22" y1="38" x2="-18.5" y2="38" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="22" y1="38" x2="18.5" y2="38" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="0" y1="28" x2="0" y2="31.5" stroke="#9b1c1c" stroke-width="0.6"/>
    <line x1="0" y1="48" x2="0" y2="44.5" stroke="#9b1c1c" stroke-width="0.6"/>
    <text x="0" y="58" text-anchor="middle" class="cut-label">✂ 口 · 剪空</text>
  </g>

  <!-- Footer instructions -->
  <text x="105" y="268" text-anchor="middle" class="hint">① 剪出橙色外框（或連紙一齊用）　② 剪空眼、口白色部分　③ 用油粉彩／水粉喺橙色範圍入面填色</text>
  <text x="105" y="275" text-anchor="middle" class="hint">④ 乾透後影相或上傳入 App「主線：影相／上傳實體面譜」　·　比例對應 App 橢圓（rx:ry ≈ 0.44:0.48）</text>
  <text x="105" y="285" text-anchor="middle" class="sub">A4 直向 · 變臉視藝 AR · 課堂主線紙樣</text>
</svg>
